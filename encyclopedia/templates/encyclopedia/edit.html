{% extends "encyclopedia/layout.html" %}

{% block title %}
edit {{ title }}
{% endblock %}

{% block body %}
<h1>Edit the content below</h1>
<form method="post">
    {% csrf_token %}
    <textarea name="editedtext" style="height: 500px; width: 800px;">{{ content|safe }}</textarea>
    <input type="submit" value="Save Change">
</form>
{% endblock %}
