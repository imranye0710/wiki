{% extends "encyclopedia/layout.html" %}

{% block title %}
Create New Page
{% endblock %}

{% block body %}
<form action="" method="post">
    {% csrf_token %}
    <h1>Create A New Entry</h1>
        <input type="text" placeholder="Type the entry name" name="entryname">
    <br>
    <br>
    <h2>Text about the entry</h2>
        <textarea placeholder="Type the markdown text" style="height: 400px; width: 800px;" name="entrytext"></textarea>
        <input type="submit">
</form>
{% endblock %}
